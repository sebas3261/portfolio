name: Notify search engines of content changes
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
permissions:
  contents: read
  statuses: read
concurrency:
  group: indexnow
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for production deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..60}; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "pending"')
            case "$state" in
              success) exit 0 ;;
              failure|error) echo "Production deployment failed; skipping search notification."; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for production deployment."
          exit 1
      - uses: actions/cache/restore@v4
        with:
          path: .indexnow-state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-v1-
      - run: node scripts/indexnow.mjs
      - uses: actions/cache/save@v4
        with:
          path: .indexnow-state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
